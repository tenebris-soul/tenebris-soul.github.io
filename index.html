<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Стартовая страница проекта с переходом к Thesaurus."
    />
    <title>Tenebris Soul | GitHub Pages</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #171513;
        --muted: #686057;
        --accent: #1f6f5b;
        --accent-dark: #145044;
        --line: rgba(23, 21, 19, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(31, 111, 91, 0.12), transparent 38%),
          linear-gradient(315deg, rgba(194, 79, 58, 0.1), transparent 42%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(920px, calc(100% - 40px));
        padding: 56px clamp(24px, 6vw, 72px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 70px rgba(23, 21, 19, 0.12);
      }

      p {
        max-width: 620px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.8vw, 1.15rem);
        line-height: 1.7;
      }

      .eyebrow {
        margin-bottom: 18px;
        color: var(--accent-dark);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0 0 18px;
        font-size: clamp(2.5rem, 7vw, 5.25rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(31, 111, 91, 0.28);
        transition:
          background 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      a:hover {
        background: var(--accent-dark);
        box-shadow: 0 16px 34px rgba(20, 80, 68, 0.32);
        transform: translateY(-1px);
      }

      a:focus-visible {
        outline: 3px solid rgba(31, 111, 91, 0.34);
        outline-offset: 4px;
      }

      svg {
        width: 20px;
        height: 20px;
        flex: none;
      }

      @media (max-width: 560px) {
        body {
          place-items: stretch;
        }

        main {
          width: 100%;
          min-height: 100vh;
          border: 0;
          border-radius: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">GitHub Pages</div>
      <h1>Tenebris Soul</h1>
      <p>
        Небольшая стартовая страница проекта. Основной раздел доступен по
        кнопке ниже.
      </p>
      <div class="actions">
        <a href="./thesaurus-page/" aria-label="Перейти на thesaurus-page">
          <span>Открыть thesaurus-page</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path
              d="M5 12h14m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
